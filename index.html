<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <style>
        /* Estilos gerais da página */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        /* Cabeçalho do Site */
        header {
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Container e Estilização da Logo */
        .logo-container img {
            max-width: 150px; /* Ajuste o tamanho máximo da logo aqui */
            height: auto;     /* Mantém a proporção correta da imagem */
            display: block;
        }

        /* Menu de navegação simples */
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #0066cc;
        }

        /* Conteúdo principal de exemplo */
        main {
            padding: 40px;
            text-align: center;
        }

        main h1 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho contendo a Logo e o Menu -->
    <header>
        <div class="logo-container">
            <a href="index.html">
                <!-- Substitua o atributo src pelo caminho ou link da sua logomarca -->
                <img src="caminho-da-sua-logo.png" alt="Logotipo da Empresa">
            </a>
        </div>
        
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Serviços</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo da Página -->
    <main>
        <h1>Bem-vindo ao nosso site!</h1>
        <p>Este é um modelo base estruturado com a sua logomarca no cabeçalho.</p>
    </main>

</body>
</html>
